name: debug-page
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install playwright -q
          python3 -m playwright install chromium --with-deps >/dev/null 2>&1 || true
          python3 scripts/resolve_build.py --save-page page.html --device bluejay --json > r.json
          URL=$(python3 -c "import json;print(json.load(open('r.json'))['url'])")
          SHA=$(python3 -c "import json;print(json.load(open('r.json'))['sha256'])")
          curl -sL -o f.zip "$URL"
          echo "$SHA  f.zip" | sha256sum -c -
          unzip -o -q f.zip -d fx
          inner=$(ls fx/*/image-*.zip)
          echo "== image zip 内容 =="; unzip -l "$inner" | head -40
          mkdir -p imgs
          unzip -o -q "$inner" -d imgs || true
          python3 - <<'EOF'
          import struct, os, glob
          for n in sorted(glob.glob("imgs/vendor_boot*.img") + glob.glob("imgs/dtbo*.img") + glob.glob("imgs/*boot*.img")):
              d = open(n, "rb").read(512)
              print("==", os.path.basename(n), "size:", os.path.getsize(n), "magic:", d[:8])
              if d[:8] == b"VNDRBOOT":
                  f = lambda o: struct.unpack_from("<I", d, o)[0]
                  print("   hdr_ver", f(8), "page", f(12), "vrd_sz", f(24),
                        "name", d[36:52], "hdr_sz", f(52), "dtb_sz", f(56))
          dt = open("imgs/dtbo.img", "rb").read(64)
          print("dtbo first 64B:", dt[:32].hex())
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: vb-heads
          path: |
            imgs/vendor_boot*.img
            imgs/dtbo.img
            imgs/boot.img
          retention-days: 3
          if-no-files-found: ignore
