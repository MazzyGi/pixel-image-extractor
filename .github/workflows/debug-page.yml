name: debug-page
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -x
          # Wayback：找最近快照
          curl -sL "http://archive.org/wayback/available?url=developers.google.com/android/images&timestamp=20261101" -o wb.json; cat wb.json
          SNAP=$(python3 -c "import json;print(json.load(open('wb.json'))['archived_snapshots']['closest']['url'])" 2>/dev/null)
          echo "SNAP=$SNAP"
          if [ -n "$SNAP" ]; then curl -sL "$SNAP" -o wb.html; wc -c wb.html; grep -c "dl.google.com" wb.html || true; fi
          # 另一个官方静态源：页面是否还响应 ?format=table / amp
          for u in "https://developers.google.com/android/images?amp=1" "https://developers.google.com/android/images?hl=en&format=INDEXABLE"; do
            echo "== $u"; curl -sL -A "Mozilla/5.0" -o /tmp/x.out -w "%{http_code} %{size_download}\n" "$u"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: probe3
          path: |
            wb.json
            wb.html
          retention-days: 1
          if-no-files-found: ignore
