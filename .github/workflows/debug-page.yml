name: debug-page
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          pip install playwright -q
          python3 -m playwright install chromium --with-deps >/dev/null 2>&1
          python3 - <<'EOF'
          import asyncio, json
          from playwright.async_api import async_playwright

          async def main():
              reqs = []
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  pg = await b.new_page()
                  pg.on("request", lambda r: reqs.append(r.url))
                  await pg.goto("https://developers.google.com/android/images?hl=en",
                                wait_until="networkidle", timeout=90000)
                  await pg.wait_for_timeout(4000)
                  html = await pg.content()
                  open("rendered.html", "w").write(html)
                  # 提取全部工厂包链接
                  links = await pg.eval_on_selector_all(
                      "a[href*='dl.google.com']",
                      "els => els.map(e => e.href)")
                  open("links.txt", "w").write("\n".join(links))
                  print("RENDERED bytes:", len(html))
                  print("DL LINKS:", len(links))
                  for l in links[:5]: print("  ", l)
              open("requests.txt", "w").write("\n".join(sorted(set(
                  u for u in reqs if "google" in u and not any(
                      x in u for x in (".js?", "gstatic.com/devrel", "fonts", ".css", ".svg", ".png", "playwright"))))))
              print("REQ SAVED")
          asyncio.run(main())
          EOF
          echo "== 数据类请求 =="; cat requests.txt | head -30
      - uses: actions/upload-artifact@v4
        with:
          name: probe4
          path: |
            rendered.html
            links.txt
            requests.txt
          retention-days: 3
