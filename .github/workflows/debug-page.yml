name: debug-page
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -x
          curl -sL -A "Mozilla/5.0" "https://developers.google.com/android/images.md.txt?hl=en" -o images.md.txt
          wc -c images.md.txt
          head -80 images.md.txt
          grep -c "factory-" images.md.txt || true
          grep -m5 "husky" images.md.txt || true
      - uses: actions/upload-artifact@v4
        with: {name: md, path: images.md.txt, retention-days: 1}
